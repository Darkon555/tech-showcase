services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  taskdata:
  ollama:
