services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: ./api
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    ports:
      - "4003:4003"
    depends_on:
      - ollama

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  ollama:
