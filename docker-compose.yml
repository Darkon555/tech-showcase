# Root orchestration — brings up all three demos at once.
# Ports: task-manager web 3001 / api 4001 · mini-pos web 4200 / api 4002 · receipt web 5173 / api 4003
name: tech-showcase

services:
  # ---- shared local LLM (used by demos 1 & 3) ----
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ---- Demo 1: task-manager-ai ----
  task-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - taskdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 5s
      retries: 10

  task-api:
    build: ./demos/task-manager-ai/api
    environment:
      DATABASE_URL: postgresql://tasks:tasks@task-db:5432/tasks
      OLLAMA_URL: http://ollama:11434
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      task-db:
        condition: service_healthy

  task-web:
    build: ./demos/task-manager-ai/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
    ports:
      - "3001:3001"
    depends_on:
      - task-api

  # ---- Demo 2: mini-pos ----
  pos-api:
    build: ./demos/mini-pos/api
    environment:
      PORT: "4002"
      DB_PATH: /data/pos.db
    volumes:
      - posdata:/data
    ports:
      - "4002:4002"

  pos-web:
    build: ./demos/mini-pos/web
    ports:
      - "4200:80"
    depends_on:
      - pos-api

  # ---- Demo 3: receipt-ocr-ai ----
  receipt-api:
    build: ./demos/receipt-ocr-ai/api
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "4003:4003"
    depends_on:
      - ollama

  receipt-web:
    build: ./demos/receipt-ocr-ai/web
    ports:
      - "5173:80"
    depends_on:
      - receipt-api

volumes:
  ollama:
  taskdata:
  posdata:
